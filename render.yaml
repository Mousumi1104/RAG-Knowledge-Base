# =============================================================================
# Render Blueprint — RAG Knowledge Base (backend API + managed Postgres)
#
# This file documents the production topology on Render. The backend is a
# Docker web service (rootDir: backend) that runs `alembic upgrade head` and
# then `uvicorn` bound to Render's injected $PORT (see backend/entrypoint.sh).
#
# Secrets are declared with `sync: false` so Render never reads a real value
# from this committed file — set them in the Render dashboard / via the API.
# The same services are also (re)created via the Render API during deploy, so
# names here MUST stay consistent with that automation.
# =============================================================================
services:
  - type: web
    name: rag-knowledge-base-api
    env: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    plan: starter
    autoDeploy: true
    # Persistent storage for uploaded source documents (PDF/DOCX/TXT/MD).
    disk:
      name: uploads
      mountPath: /app/uploads
      sizeGB: 1
    envVars:
      # --- Non-secret configuration (safe to commit) -----------------------
      - key: EMBEDDING_PROVIDER
        value: gemini
      - key: EMBEDDING_DIM
        value: "384"
      - key: VECTOR_DB
        value: pgvector
      - key: LLM_PROVIDER
        value: gemini
      - key: GEMINI_MODEL
        value: gemini-3.5-flash
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "720"
      - key: TOP_K
        value: "8"
      - key: CHUNK_SIZE
        value: "500"
      - key: CHUNK_OVERLAP
        value: "100"
      - key: MAX_UPLOAD_MB
        value: "0"
      - key: ALLOWED_EXTENSIONS
        value: pdf,docx,txt,md
      - key: LOG_LEVEL
        value: INFO
      # --- Secrets (set in dashboard / API; never committed) ---------------
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_API_KEY_FALLBACK
        sync: false
      - key: JWT_SECRET_KEY
        sync: false
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: CORS_ORIGINS
        sync: false

  # ---------------------------------------------------------------------------
  # Scheduling moved to GitHub Actions -> POST /internal/run-collab-reminders
  # (see .github/workflows/collab-reminder.yml). Render's free plan has no
  # cron/Blueprint scheduler, so the collab-day reminder job is now triggered by
  # a free daily GitHub Actions workflow hitting a secret-gated endpoint on the
  # web service above. Set CRON_SECRET (and NOTIFICATIONS_ENABLED + the
  # notification creds) as env vars on the web service to enable it.
  # ---------------------------------------------------------------------------

databases:
  - name: rag-knowledge-base-db
    postgresMajorVersion: "16"
