# =============================================================================
# Render Blueprint — RAG Knowledge Base (backend API + managed Postgres)
#
# This file documents the production topology on Render. The backend is a
# Docker web service (rootDir: backend) that runs `alembic upgrade head` and
# then `uvicorn` bound to Render's injected $PORT (see backend/entrypoint.sh).
#
# Secrets are declared with `sync: false` so Render never reads a real value
# from this committed file — set them in the Render dashboard / via the API.
# The same services are also (re)created via the Render API during deploy, so
# names here MUST stay consistent with that automation.
# =============================================================================
services:
  - type: web
    name: rag-knowledge-base-api
    env: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    plan: starter
    autoDeploy: true
    # Persistent storage for uploaded source documents (PDF/DOCX/TXT/MD).
    disk:
      name: uploads
      mountPath: /app/uploads
      sizeGB: 1
    envVars:
      # --- Non-secret configuration (safe to commit) -----------------------
      - key: EMBEDDING_PROVIDER
        value: gemini
      - key: EMBEDDING_DIM
        value: "384"
      - key: VECTOR_DB
        value: pgvector
      - key: LLM_PROVIDER
        value: gemini
      - key: GEMINI_MODEL
        value: gemini-3.5-flash
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "720"
      - key: TOP_K
        value: "8"
      - key: CHUNK_SIZE
        value: "500"
      - key: CHUNK_OVERLAP
        value: "100"
      - key: MAX_UPLOAD_MB
        value: "0"
      - key: ALLOWED_EXTENSIONS
        value: pdf,docx,txt,md
      - key: LOG_LEVEL
        value: INFO
      # --- Secrets (set in dashboard / API; never committed) ---------------
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_API_KEY_FALLBACK
        sync: false
      - key: JWT_SECRET_KEY
        sync: false
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: CORS_ORIGINS
        sync: false

  # ---------------------------------------------------------------------------
  # Collaboration-day reminder cron. Runs at 13:30 UTC (= 19:00 IST) daily — the
  # evening BEFORE each collab day. Shares the SAME Postgres as the web service.
  # Ships in DRY-RUN: NOTIFICATIONS_ENABLED="false" and all creds are sync:false,
  # so it logs "[dry-run] ..." and writes NO ledger rows until secrets are set.
  # ---------------------------------------------------------------------------
  - type: cron
    name: rag-collab-reminder
    env: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    schedule: "30 13 * * *"
    dockerCommand: python scripts/collab_reminder.py
    plan: starter
    autoDeploy: true
    envVars:
      # Same DB as the web service (set to the identical connection string).
      - key: DATABASE_URL
        sync: false
      # Explicit dry-run: real sending stays OFF until this is flipped to "true".
      - key: NOTIFICATIONS_ENABLED
        value: "false"
      # --- Notification secrets (set in dashboard / API; never committed) ------
      - key: FIREBASE_CREDENTIALS_JSON
        sync: false
      - key: GOOGLE_APPLICATION_CREDENTIALS
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false

databases:
  - name: rag-knowledge-base-db
    postgresMajorVersion: "16"
